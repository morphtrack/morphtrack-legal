# Jekyll config for the MorphTrack legal pages (GitHub Pages).
# No remote theme — pages use the local _layouts/default.html so we control the
# look (clean legal typography, no repo-name header) and keep the existing
# clean URLs (/v2/terms, /v2/privacy-policy, …) unchanged.
title: MorphTrack
description: MorphTrack legal documents
# Apply the default layout to every page so the .md files need only a title.
defaults:
  - scope:
      path: ""
    values:
      layout: default
